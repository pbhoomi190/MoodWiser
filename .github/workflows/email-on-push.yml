name: Email pull request commit

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  email-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REF: ${{ github.event.pull_request.head.ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          from urllib.request import Request, urlopen
          from email.message import EmailMessage

          required = (
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_FROM",
              "SMTP_TO",
              "GITHUB_TOKEN",
              "COMMIT_SHA",
              "HEAD_REPOSITORY",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError(
                  "Configure these GitHub Actions values before using this workflow: "
                  + ", ".join(missing)
              )

          commit_url = (
              f"https://api.github.com/repos/{os.environ['HEAD_REPOSITORY']}"
              f"/commits/{os.environ['COMMIT_SHA']}"
          )
          request = Request(
              commit_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              commit = json.load(response)
          commit_message = commit["commit"]["message"]

          port = int(os.environ["SMTP_PORT"])
          message = EmailMessage()
          message["From"] = os.environ["SMTP_FROM"]
          message["To"] = os.environ["SMTP_TO"]
          commit_title = commit_message.splitlines()
          message["Subject"] = "Pull request commit: " + (
              commit_title[0] if commit_title else "(no commit message)"
          )
          message.set_content(
              f"Pull request #{os.environ['PULL_REQUEST_NUMBER']}: "
              f"{os.environ['PULL_REQUEST_TITLE']}\n"
              f"Pull request: {os.environ['PULL_REQUEST_URL']}\n\n"
              f"Commit message:\n{commit_message}\n\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Branch: {os.environ['REF']}\n"
              f"Commit: {os.environ['COMMIT_SHA']}\n"
          )

          context = ssl.create_default_context()
          if port == 465:
              with smtplib.SMTP_SSL(
                  os.environ["SMTP_HOST"], port, context=context
              ) as smtp:
                  smtp.login(
                      os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"]
                  )
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(os.environ["SMTP_HOST"], port) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(
                      os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"]
                  )
                  smtp.send_message(message)
          PY
