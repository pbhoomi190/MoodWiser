name: Email pushed commit message

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  email-commit:
    if: github.event.deleted == false && github.event.head_commit != null
    runs-on: ubuntu-latest
    steps:
      - name: Send commit message to pusher
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SENDER_EMAIL: ${{ github.event.pusher.email }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = (
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_FROM",
              "SENDER_EMAIL",
              "COMMIT_MESSAGE",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError(
                  "Configure these GitHub Actions values or ensure the push "
                  "sender has an email address: " + ", ".join(missing)
              )

          commit_message = os.environ["COMMIT_MESSAGE"]
          message = EmailMessage()
          message["From"] = os.environ["SMTP_FROM"]
          message["To"] = os.environ["SENDER_EMAIL"]
          message["Subject"] = commit_message.splitlines()[0]
          message.set_content(commit_message)

          port = int(os.environ["SMTP_PORT"])
          context = ssl.create_default_context()
          if port == 465:
              with smtplib.SMTP_SSL(
                  os.environ["SMTP_HOST"], port, context=context
              ) as smtp:
                  smtp.login(
                      os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"]
                  )
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(os.environ["SMTP_HOST"], port) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(
                      os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"]
                  )
                  smtp.send_message(message)
          PY
