name: Email commit message

on:
  pull_request:
    branches:
      - "**"

jobs:
  email-commit:
    if: github.event.deleted == false && github.event.head_commit != null
    runs-on: ubuntu-latest
    steps:
      - name: Send commit email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = (
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_FROM",
              "SMTP_TO",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError(
                  "Configure these GitHub Actions secrets before using this workflow: "
                  + ", ".join(missing)
              )

          port = int(os.environ["SMTP_PORT"])
          message = EmailMessage()
          message["From"] = os.environ["SMTP_FROM"]
          message["To"] = os.environ["SMTP_TO"]
          commit_title = os.environ["COMMIT_MESSAGE"].splitlines()
          message["Subject"] = "Commit pushed: " + (
              commit_title[0] if commit_title else "(no commit message)"
          )
          message.set_content(
              f"Commit message:\n{os.environ['COMMIT_MESSAGE']}\n\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Branch: {os.environ['REF']}\n"
              f"Commit: {os.environ['COMMIT_SHA']}\n"
          )

          context = ssl.create_default_context()
          if port == 465:
              with smtplib.SMTP_SSL(
                  os.environ["SMTP_HOST"], port, context=context
              ) as smtp:
                  smtp.login(
                      os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"]
                  )
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(os.environ["SMTP_HOST"], port) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(
                      os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"]
                  )
                  smtp.send_message(message)
          PY
